<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="EngBridge">
<title>EngBridge – İngilizce A1→C2</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="stylesheet" href="css/app.css?v=1">
</head>
<body>
<header class="top">
  <div class="brand"><b>Eng</b>Bridge</div>
  <label class="levelpick">Seviyem
    <select id="levelSelect" aria-label="Seviyem"></select>
  </label>
</header>

<main id="view" tabindex="-1"><div class="empty">Yükleniyor…</div></main>

<nav class="tabs" aria-label="Bölümler">
  <button data-tab="learn" class="on"><span class="ic">📘</span>Dersler</button>
  <button data-tab="read"><span class="ic">🎧</span>Okuma</button>
  <button data-tab="errors"><span class="ic">🎯</span>Hatalar<span class="badge" id="errBadge" hidden></span></button>
  <button data-tab="vault"><span class="ic">🗂️</span>Kelimeler<span class="badge" id="vaultBadge" hidden></span></button>
  <button data-tab="ai"><span class="ic">✨</span>AI</button>
</nav>

<div id="sheet" class="sheet" hidden><div class="sheet-card" role="dialog" aria-modal="true"><button class="sheet-x" aria-label="Kapat">×</button><div id="sheetBody"></div></div></div>
<div id="toast" class="toast" hidden></div>

<script type="module" src="js/app.js?v=1"></script>
</body>
</html>
